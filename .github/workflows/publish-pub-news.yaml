name: publish-pub-news
run-name: "Publish Pub News issue #${{ github.event.issue.number }}"

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled

concurrency:
  group: publish-pub-news
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish-news:
    if: >-
      (startsWith(github.event.issue.title, '[Pub News]') ||
      contains(github.event.issue.labels.*.name, 'pub-news')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate news post
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/publish_pub_news.py
          --event "$GITHUB_EVENT_PATH"
          --repo-root "$GITHUB_WORKSPACE"

      - name: Set generated issue title
        if: github.event.issue.title != steps.generate.outputs.issue_title
        uses: actions/github-script@v9
        env:
          ISSUE_TITLE: ${{ steps.generate.outputs.issue_title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: context.issue.number,
              title: process.env.ISSUE_TITLE,
            });

      - name: Commit and push generated news
        if: steps.generate.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POST_PATH: ${{ steps.generate.outputs.post_path }}
          COVER_PATH: ${{ steps.generate.outputs.cover_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$POST_PATH"
          if [ -n "$COVER_PATH" ]; then git add -- "$COVER_PATH"; fi
          git commit -m "Publish news from Pub News issue #$ISSUE_NUMBER"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Comment on published issue
        if: steps.generate.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          POST_PATH: ${{ steps.generate.outputs.post_path }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `✅ 新闻文件已生成：\`${process.env.POST_PATH}\`。网站正在重新构建。`,
            });

      - name: Comment when generation fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `❌ 自动发布失败，请检查表单格式和 Actions 日志：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

  build-site:
    needs: publish-news
    if: needs.publish-news.outputs.changed == 'true'
    uses: ./.github/workflows/build-site.yaml
