name: Pub News
description: 提交论文录用信息，并自动生成一条中英文新闻。
title: "[Pub News]"
labels:
  - pub-news
body:
  - type: markdown
    attributes:
      value: "**Issue 标题已经自动填写，无需修改。**"

  - type: input
    id: venue
    attributes:
      label: 会议 / 期刊
      description: 只填写会议或期刊名称，年份在下一项单独填写。
      placeholder: 例如 KDD、ICLR、Pattern Recognition
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份
      placeholder: 例如 2027
    validations:
      required: true

  - type: input
    id: count
    attributes:
      label: 论文数量
      description: 只填写正整数，并确保与下方的论文组数一致。
      placeholder: 例如 2
    validations:
      required: true

  - type: textarea
    id: papers
    attributes:
      label: 论文条目
      description: 将每个字段冒号后的提示文字替换为实际内容。每项必须独占一行；多篇论文时，完整复制整个论文块。
      render: text
      value: |-
        【论文开始】
        题目：论文英文题目
        链接：https://doi.org/...
        中文概要：中文工作概括，建议约 100 字。
        英文概要：English summary of the work.
        【论文结束】
    validations:
      required: true

  - type: textarea
    id: cover
    attributes:
      label: 新闻封面
      description: 可将 JPG、PNG 或 WebP 格式的会议/期刊图标直接拖入此处，或填写仓库内已有图片路径（例如 images/news/kdd26.webp）。上传图片会自动居中裁成 8:5，并保存为最大 1200 × 750 的 WebP。
      placeholder: 将图片拖入此处，或填写 images/news/example.webp
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 发布确认
      options:
        - label: 我已检查会议/期刊、年份以及每篇论文的题目、链接和中英文概括。
          required: true
